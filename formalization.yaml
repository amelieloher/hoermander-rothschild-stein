    - declaration: "Hormander.Interface.exists_smooth_aeRepresentative"
      file: "Hormander/Interface.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparators/Hormander/comparator.json"
      literature_dependencies: []
    - declaration: "RothschildStein.rs3_no_drift_sobolev"
