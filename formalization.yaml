version: "v0.4"

project:
  name: "Hörmander's hypoellipticity theorem and the Rothschild–Stein theory"
  description: >-
    A Lean 4 / Mathlib formalization of the regularity theory of Hörmander
    operators: second-order operators built from smooth vector fields
    X_1, ..., X_q (and possibly a drift X_0) whose iterated commutators span
    the tangent space at every point. It proves Hörmander's 1967 theorem that
    such operators are hypoelliptic: every locally integrable weak solution of
    X_0 u + sum X_i^2 u + c u = g with smooth data is smooth. It then develops
    the Rothschild–Stein theory (Acta Math. 1976), following Bramanti and
    Brandolini's "Hörmander Operators" (2023): lifting and approximation of
    the fields by the generators of a homogeneous group; the homogeneous
    fundamental solution and singular-integral estimates on homogeneous
    groups; and the sharp interior estimates, by which a distributional
    solution of sum X_i^2 T = f with f in W^{k,p}_X or C^{k,alpha}_X is a
    function in W^{k+2,p}_X or C^{k+2,alpha}_X, for every k >= 0, and at
    k = 0 with a drift. The formalization also proves the formal
    Baker–Campbell–Hausdorff theorem, Chow–Rashevskii connectivity, and the
    Nagel–Stein–Wainger theorems on control balls (ball-box, volume and
    doubling, comparison of distances), uniformly over compact sets.
    On Carnot groups, given as homogeneous groups whose weight-one
    canonical fields satisfy Hörmander's condition, it constructs the heat
    kernel of the sub-Laplacian sum X_i^2 and proves that it is smooth,
    symmetric, conservative, left-invariant and dilation covariant, satisfies
    the semigroup law, and obeys two-sided Gaussian bounds in the horizontal
    control distance. Along the way it proves the scale-invariant Poincaré
    inequality on control balls, and the parabolic Harnack inequality, the
    Hölder continuity of weak solutions and the elliptic Harnack inequality
    for divergence-form operators sum X_i(a_ij X_j) with measurable,
    symmetric, uniformly elliptic coefficients.
  authors:
    - "Scott Armstrong"
    - "Amélie Loher"
  responsible_maintainers:
    - "Scott Armstrong"
    - "Amélie Loher"
  affiliations:
    - "Scott Armstrong: CNRS and Laboratoire Jacques-Louis Lions, Sorbonne Université; Courant Institute School of Mathematics, Computing, and Data Science, New York University"
    - "Amélie Loher: All Souls College, University of Oxford"
  license: "Apache-2.0"
  funding:
    - "Scott Armstrong was supported by the European Research Council (ERC) under the European Union's Horizon Europe research and innovation programme, grant agreement No. 101200828."
    - "Amélie Loher acknowledges support from the Fondation Sciences Mathématiques de Paris."

