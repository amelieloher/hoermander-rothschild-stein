status:
  scope: >-
    Complete for Hörmander's hypoellipticity theorem (operators
    X_0 + sum X_i^2 + c with smooth real coefficients on an open subset of
    R^N) and for the Rothschild–Stein interior estimates of Bramanti–Brandolini
    Theorems 11.1 (every k >= 0, Sobolev and Hölder, without drift) and 11.2
    (k = 0, with a drift of weight 2), together with the lifting and
    approximation theorem (Theorem 10.6), the homogeneous fundamental solution
    (Theorem 11.5), global and local estimates on homogeneous groups, the
    formal Baker–Campbell–Hausdorff theorem (Theorem 9.18), Chow–Rashevskii
    connectivity, and the Nagel–Stein–Wainger ball-box, volume, doubling and
    distance-comparison theorems. Not formalized: Chapter 12 of
    Bramanti–Brandolini, and higher-order interior estimates (k >= 1) with a
    drift for general fields, which Bramanti–Brandolini do not state in
    Chapter 11. On Carnot groups, complete for the heat kernel of the
    sub-Laplacian with two-sided Gaussian bounds, the same-ball Poincaré
    inequality for every exponent 1 <= p < infinity, and the parabolic
    Harnack inequality, Hölder continuity and elliptic Harnack inequality
    for symmetric measurable uniformly elliptic coefficients along the
    horizontal fields. Not formalized: heat kernels for general Hörmander
    fields, non-symmetric operators or local domains, and derivative bounds
    for the heat kernel.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]
